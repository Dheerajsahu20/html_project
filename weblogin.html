<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to right, #f0f2f5, #ffffff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            display: flex;
            max-width: 980px;
            width: 100%;
            padding: 20px;
            gap: 40px;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            color: #1877f2;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .tagline {
            font-size: 1.6rem;
            font-weight: 400;
            color: #1c1e21;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .right-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            padding: 40px 40px 24px;
            width: 396px;
        }

        .login-card {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1c1e21;
            margin-bottom: 16px;
        }

        .login-subtitle {
            font-size: 0.875rem;
            color: #606770;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 1rem;
            background: #fefefe;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, .2);
        }

        .login-btn {
            width: 100%;
            background: #1877f2;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #166fe5;
        }

        .login-btn:disabled {
            background: #42b883;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #606770;
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dadde1;
        }

        .divider span {
            padding: 0 16px;
        }

        .create-account {
            text-align: center;
            margin-top: 24px;
        }

        .create-btn {
            background: #42b883;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .create-btn:hover {
            background: #36a26f;
        }

        .forgot-password {
            color: #1877f2;
            font-size: 0.875rem;
            text-decoration: none;
            display: block;
            margin-top: 16px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #f02849;
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: none;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                padding: 20px 10px;
            }
            
            .right-section {
                width: 100%;
                max-width: 396px;
                margin: 0 auto;
            }
            
            .logo {
                font-size: 2.8rem;
            }
            
            .tagline {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <div class="logo">facebook</div>
            <div class="tagline">
                Connect with friends and the world around you on Facebook.
            </div>
        </div>

        <div class="right-section">
            <div class="login-card">
                <h1 class="login-title">Log In</h1>
                <p class="login-subtitle">Enter your password to continue.</p>
                
                <div class="error-message" id="errorMessage">
                    Please enter a valid email or phone number and password.
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="email" placeholder="Email or Phone Number" required>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                    
                    <button type="submit" class="login-btn" id="loginBtn">
                        Log In
                    </button>
                </form>

                <a href="#" class="forgot-password">Forgot Password?</a>

                <div class="divider">
                    <span>or</span>
                </div>

                <div class="create-account">
                    <a href="#" class="create-btn">Create New Account</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Input validation and focus effects
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('input', function() {
                this.style.borderColor = '#dddfe2';
                this.style.boxShadow = 'none';
                errorMessage.style.display = 'none';
            });
        });

        // Form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Basic validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                emailInput.focus();
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                passwordInput.focus();
                return;
            }

            // Simulate login process
            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;

            setTimeout(() => {
                // Simulate successful login
                alert('Login successful! (This is a demo)');
                
                // Reset form
                loginForm.reset();
                loginBtn.textContent = 'Log In';
                loginBtn.disabled = false;
            }, 2000);
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Add Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && loginForm.contains(document.activeElement)) {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // Auto-focus first input
        emailInput.focus();
    </script>
</body>
</html>
